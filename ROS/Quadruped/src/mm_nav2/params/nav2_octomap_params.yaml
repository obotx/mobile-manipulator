lifecycle_manager_localization:
  ros__parameters:
    use_sim_time: True
    autostart: true
    node_names: ['amcl']

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: True
    autostart: true
    node_names: [
      'controller_server',
      'smoother_server', 
      'planner_server',
      'behavior_server',
      'bt_navigator',
      'waypoint_follower',
      'velocity_smoother'
    ]

amcl:
  ros__parameters:
    use_sim_time: True
    odom_frame_id: 'odom'
    base_frame_id: 'obotx_base_footprint_platform'
    global_frame_id: 'map'
    set_initial_pose: true
    initial_pose: {x: 0.0, y: 0.0, z: 0.0, yaw: 0.0}  
    tf_broadcast: true
    
    always_free_space: true
    min_particles: 1
    max_particles: 1
    alpha1: 0.0
    alpha2: 0.0
    alpha3: 0.0
    alpha4: 0.0
    
    # Silence AMCL's laser dependency (won't be used)
    scan_topic: "dummy_scan"
    laser_model_type: "likelihood_field"
    transform_tolerance: 0.1
    
    # Optional: Zero out odometry noise for deterministic behavior
    alpha1: 0.0
    alpha2: 0.0
    alpha3: 0.0
    alpha4: 0.0

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: True
      update_frequency: 10.0
      publish_frequency: 10.0
      global_frame: map
      robot_base_frame: obotx_base_footprint_platform
      rolling_window: false
      width: 25
      height: 25
      resolution: 0.05
      robot_radius: 0.7

      plugins: ["static_layer", "inflation_layer"]
      
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: "/padded_map"
        map_subscribe_transient_local: true
        subscribe_to_updates: true
        enabled: true
        trinary_costmap: true
        
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 1.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: True
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: obotx_base_footprint_platform
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.7
      plugins: ["inflation_layer"]
      
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 1.0

planner_server:
  ros__parameters:
    use_sim_time: True
    planner_plugins: ["GridBased", "SmacPlannerLattice"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true
    SmacPlannerLattice:
      plugin: "nav2_smac_planner::SmacPlannerLattice"
      tolerance: 0.2
      allow_unknown: true
      max_iterations: 100000
      max_on_approach_iterations: 1000


controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 50.0
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.05
      movement_time_allowance: 20.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 0.20
      stateful: true
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: true
      min_vel_x: 0.0
      max_vel_x: 0.5
      min_vel_y: 0.0
      max_vel_y: 0.5
      max_vel_theta: 1.5
      min_speed_xy: 0.0
      max_speed_xy: 0.7
      min_speed_theta: 0.0
      acc_lim_x: 2.5
      acc_lim_y: 2.5
      acc_lim_theta: 3.2
      decel_lim_x: -2.5
      decel_lim_y: -2.5
      decel_lim_theta: -3.2
      vx_samples: 20
      vy_samples: 20
      vtheta_samples: 20
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.15
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: [
        "RotateToGoal", 
        "Oscillation", 
        "BaseObstacle", 
        "GoalAlign", 
        "PathAlign", 
        "PathDist", 
        "GoalDist"
      ]
      BaseObstacle.scale: 0.05
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      GoalAlign.scale: 8.0
      GoalAlign.forward_point_distance: 0.1
      RotateToGoal.scale: 16.0

smoother_server:
  ros__parameters: 
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother: 
      plugin: "nav2_smoother::SimpleSmoother"

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: obotx_base_footprint_platform
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.50
    min_rotational_vel: 0.40
    rotational_acc_lim: 3.2

bt_navigator:
  ros__parameters: 
    use_sim_time: True
    global_frame: map
    robot_base_frame: obotx_base_footprint_platform
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    follow_path_error_code: 0
    compute_path_error_code: 1
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"

    max_velocity: [0.5, 0.5, 1.8]
    min_velocity: [-0.5, -0.5, -1.8]

    max_accel: [2.5, 2.5, 3.2]
    max_decel: [-2.5, -2.5, -3.2]

    odom_topic: "odom"
    odom_duration: 0.1