lifecycle_manager_localization:
  ros__parameters:
    use_sim_time: True
    autostart: true
    node_names: ['amcl']

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: True
    autostart: true
    node_names: [
      'controller_server',
      'smoother_server', 
      'planner_server',
      'behavior_server',
      'bt_navigator',
      'waypoint_follower',
      'velocity_smoother'
    ]

amcl:
  ros__parameters:
    use_sim_time: True
    odom_frame_id: 'odom_gt'
    base_frame_id: 'obotx_base_footprint_platform'
    global_frame_id: 'map'
    set_initial_pose: true
    initial_pose: {x: 0.0, y: 0.0, z: 0.0, yaw: 0.0}  
    tf_broadcast: true
    
    always_free_space: true
    min_particles: 1
    max_particles: 1
    alpha1: 0.0
    alpha2: 0.0
    alpha3: 0.0
    alpha4: 0.0
    
    scan_topic: "dummy_scan"
    laser_model_type: "likelihood_field"
    transform_tolerance: 0.1
    
    alpha1: 0.0
    alpha2: 0.0
    alpha3: 0.0
    alpha4: 0.0

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: True
      update_frequency: 10.0
      publish_frequency: 10.0
      global_frame: map
      robot_base_frame: obotx_base_footprint_platform
      rolling_window: false
      width: 25
      height: 25
      resolution: 0.05
      robot_radius: 0.7
      # footprint: "[[0.55,0.55],[0.55,-0.55],[-0.55,-0.55],[-0.55,0.55]]"
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: "/padded_map"
        map_subscribe_transient_local: true
        subscribe_to_updates: true
        enabled: true
        trinary_costmap: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 1.0
        cost_scaling_factor: 2.0         
        inflate_unknown: false
        inflate_around_unknown: false

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: True
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom_gt
      robot_base_frame: obotx_base_footprint_platform
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      robot_radius: 0.645
      # footprint: "[[0.55,0.55],[0.55,-0.55],[-0.55,-0.55],[-0.55,0.55]]"
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: "/padded_map"
        map_subscribe_transient_local: true
        subscribe_to_updates: true
        enabled: true
        trinary_costmap: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.65
        cost_scaling_factor: 1.0 
        

planner_server:
  ros__parameters:
    use_sim_time: True
    planner_plugins: ["GridBased"]  
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 3.0
      use_astar: true
      allow_unknown: true
      use_final_approach_orientation: false

controller_server:
  ros__parameters:
    controller_frequency: 30.0
    enable_stamped_cmd_vel : true
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.02
      yaw_goal_tolerance: 0.02
      stateful: True
    PathHandler:
      plugin: "nav2_controller::FeasiblePathHandler"
      prune_distance: 2.0
      enforce_path_inversion: False
      enforce_path_rotation: False
      inversion_xy_tolerance: 0.2
      inversion_yaw_tolerance: 0.4
      minimum_rotation_angle: 0.785
      reject_unit_path: False
    odom_topic: odom  
    odom_frame: odom_gt
    use_sim_time: true
    controller_plugins: ["FollowPath"]
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      motion_model: "Omni"
      time_steps: 56
      model_dt: 0.05
      batch_size: 2000
      iteration_count: 1
      vx_max: 0.5
      vx_min: -0.5
      vy_max: 0.5
      vy_min: -0.5
      wz_max: 1.5
      wz_min: -1.5
      vx_std: 0.2
      vy_std: 0.2
      wz_std: 0.4
      ax_max: 3.0
      ay_max: 3.0
      az_max: 3.5
      prune_distance: 4.0
      transform_tolerance: 0.1 
      temperature: 0.3
      gamma: 0.065
      visualize: true
      trajectory_step: 5
      time_step: 3
      collision_lookahead_time: 3.0
      critics: [
        "ConstraintCritic",
        "GoalCritic",
        "GoalAngleCritic",
        "PathAlignCritic",
        "PathFollowCritic",
        "PathAngleCritic",
        "CostCritic",
      ]

      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0

      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 30.0
        threshold_to_consider: 1.4

      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 30.0
        threshold_to_consider: 1.0

      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 15.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: true

      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 15.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4

      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 1

      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        # consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother", "curvature_smoother"]
    curvature_smoother:
      plugin: "nav2_ceres_costaware_smoother/CeresCostawareSmoother"
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    local_frame: odom_gt
    global_frame: map
    robot_base_frame: obotx_base_footprint_platform
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.50
    min_rotational_vel: 0.40
    rotational_acc_lim: 3.2

bt_navigator:
  ros__parameters: 
    use_sim_time: True
    global_frame: map
    robot_base_frame: obotx_base_footprint_platform
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    follow_path_error_code: 0
    compute_path_error_code: 1
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
      default_nav_to_pose_bt_xml: "nav_to_pose_and_pause_near_goal_obstacle.xml"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"

    max_velocity: [0.5, 0.5, 1.8]
    min_velocity: [-0.5, -0.5, -1.8]

    max_accel: [2.5, 2.5, 3.2]
    max_decel: [-2.5, -2.5, -3.2]

    odom_topic: "/odom" 
    odom_duration: 0.1