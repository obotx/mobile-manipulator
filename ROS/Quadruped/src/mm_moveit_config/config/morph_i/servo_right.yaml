publish_period: 0.01
max_expected_latency: 0.1

command_in_type: "speed_units"
scale:
  linear:  0.2  # Max linear velocity [m/s]
  rotational:  0.8  # Max angular velocity [rad/s]
  joint: 0.5

command_out_type: trajectory_msgs/JointTrajectory

publish_joint_positions: true
publish_joint_velocities: true
publish_joint_accelerations: false

use_smoothing: true
smoothing_filter_plugin_name: "online_signal_smoothing::AccelerationLimitedPlugin"

is_primary_planning_scene_monitor: true
check_octomap_collisions: false

move_group_name: right_arm 

lower_singularity_threshold: 17.0
hard_stop_singularity_threshold: 50.0 
leaving_singularity_threshold_multiplier: 3.0 
joint_limit_margins: [0.0] 

cartesian_command_in_topic: ~/delta_twist_cmds
joint_command_in_topic: ~/delta_joint_cmds
pose_command_in_topic: ~/pose_cmd
joint_topic: /joint_states
status_topic: ~/status
command_out_topic: /right_arm_controller/joint_trajectory 

check_collisions: false
collision_check_rate: 30.0  # [Hz]
self_collision_proximity_threshold: 0.01  # [m]
scene_collision_proximity_threshold: 0.02  # [m]
